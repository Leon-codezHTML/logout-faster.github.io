<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: rgb(21, 21, 177);
        }
        button {
            font-size: 100px;
            border-radius: 50px;
            border: 10px dashed red;
            background: pink;
            font-family:Georgia, 'Times New Roman', Times, serif;
            animation: button 1s linear infinite;
        }
        div {
            justify-content: center;
            align-items: center;
            padding-top: 300px;
            padding-left: 300px;
        }
        @keyframes button {
            0%{color: red;}
            50%{color: black;}
            100%{color: red;}
        }
    </style>
</head>
<body>
<div>
        <button>
            SCHNELL ABMELDEN!!!
        </button>
</div>
</body>
</html>
